<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Régler votre accompagnement — Laura Ballo Coaching</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="/assets/img/Laura-Ballo-black-trim.png" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --fond: #F7F1EC; --blanc: #FFFFFF; --brun: #3D3128; --texte: #4A3C35; --doux: #8A7068; --gris: #6C6059;
      --bordure: #D9CEC7; --filet: #EFE7E1; --or: #C4A574; --sable: #E0D3BD; --rouge: #A83932; --rouge-fonce: #8A2E28;
      --ok: #3F5A3A; --ok-fond: #EEF3EC;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Jost', sans-serif; background: var(--fond); color: var(--brun); min-height: 100vh; }
    .entete { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 40px 24px 28px; }
    .entete img { height: 78px; width: auto; display: block; }
    .entete .filet { width: 64px; height: 1px; background: var(--or); }
    @media (max-width: 560px) { .entete { padding: 28px 16px 20px; } .entete img { height: 60px; } }
    main { max-width: 640px; margin: 0 auto; padding: 0 16px 96px; display: flex; flex-direction: column; gap: 32px; }
    .intro { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .surtitre { font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: #8A6F5E; }
    .intro h1 { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(34px, 5vw, 50px); line-height: 1.1; }
    .intro .programme { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 21px; color: var(--gris); }
    .carte { background: var(--blanc); border-radius: 22px; padding: 40px 44px; box-shadow: 0 2px 18px rgba(61,49,40,0.05); }
    @media (max-width: 560px) { .carte { padding: 28px 20px; border-radius: 18px; } }
    .total { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--filet); }
    .total span { font-size: 15px; color: var(--gris); }
    .total b { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 38px; color: var(--brun); }
    .echeances { list-style: none; margin: 18px 0 8px; display: flex; flex-direction: column; }
    .echeances li { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--filet); font-size: 16px; }
    .echeances li:last-child { border-bottom: none; }
    .echeances .pastille { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--bordure); display: grid; place-items: center; font-size: 14px; color: var(--gris); }
    .echeances li.premier .pastille { border: none; background: var(--rouge); color: #fff; }
    .echeances li.fait .pastille { border: none; background: var(--sable); color: var(--brun); }
    .echeances .quand { display: flex; flex-direction: column; gap: 2px; }
    .echeances .quand small { font-size: 13px; color: var(--doux); }
    .echeances .montant { font-weight: 500; }
    .note { margin-top: 14px; font-size: 14px; line-height: 1.6; color: var(--doux); }
    .actions { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 26px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 0 44px; border: none; border-radius: 999px; background: var(--rouge); color: #fff; font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; text-decoration: none; transition: background 0.2s; }
    .btn:hover { background: var(--rouge-fonce); }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    .securise { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--doux); }
    .erreur { display: none; width: 100%; padding: 14px 18px; border-radius: 10px; background: #FBF0EE; border: 1px solid #E8B4A8; color: var(--rouge-fonce); font-size: 15px; line-height: 1.5; text-align: center; }
    .bandeau { padding: 14px 18px; border-radius: 12px; font-size: 16px; line-height: 1.55; margin-bottom: 20px; }
    .bandeau.ok { background: var(--ok-fond); color: var(--ok); }
    .bandeau.alerte { background: #FBF1EE; color: var(--rouge-fonce); }
    .etat { text-align: center; padding: 48px 32px; }
    .etat h2 { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 36px; margin-bottom: 12px; }
    .etat p { max-width: 460px; margin: 0 auto; font-size: 17px; line-height: 1.7; font-weight: 300; color: var(--texte); }
    .cache { display: none !important; }
    footer { text-align: center; padding: 0 24px 40px; font-size: 13px; color: var(--doux); }
  </style>
</head>
<body>
<header class="entete">
  <img src="/assets/img/Laura-Ballo-black-trim.png" alt="Laura Ballo Coaching" />
  <span class="filet" aria-hidden="true"></span>
</header>

<main>
  <div id="chargement" class="carte etat"><p>Chargement…</p></div>
  <div id="message" class="carte etat cache"><h2 id="message-titre"></h2><p id="message-texte"></p></div>

  <div id="paiement" class="cache" style="display:flex;flex-direction:column;gap:32px">
    <section class="intro">
      <p class="surtitre">Règlement de l'accompagnement</p>
      <h1 id="titre">Régler votre accompagnement</h1>
      <p class="programme" id="programme"></p>
    </section>

    <div class="carte">
      <div class="bandeau cache" id="bandeau"></div>
      <div class="total"><span>Montant de l'accompagnement</span><b id="total"></b></div>
      <ol class="echeances" id="echeances"></ol>
      <p class="note" id="note"></p>
      <div class="actions" id="actions">
        <button type="button" class="btn" id="payer">Payer par carte</button>
        <span class="securise">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
          Paiement sécurisé par Stripe
        </span>
        <div class="erreur" id="erreur"></div>
      </div>
    </div>
  </div>
</main>

<footer>Laura Ballo Coaching · paiement confidentiel</footer>

<script>
  const params = new URLSearchParams(location.search);
  const jeton = params.get("t") || "", sessionId = params.get("session_id") || "";
  const $ = (id) => document.getElementById(id);
  const montrer = (id) => ["chargement", "message", "paiement"].forEach((x) => $(x).classList.toggle("cache", x !== id));
  const message = (titre, texte) => { $("message-titre").textContent = titre; $("message-texte").textContent = texte; montrer("message"); };
  const date = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });

  function afficher(j) {
    const prenom = (j.client || "").split(" ")[0];
    $("titre").textContent = prenom ? prenom + ", réglez votre accompagnement" : "Régler votre accompagnement";
    $("programme").textContent = j.programme || "";
    $("total").textContent = j.total + " €";
    const liste = $("echeances"); liste.innerHTML = "";
    j.echeances.forEach((e, i) => {
      const li = document.createElement("li");
      const fait = i < j.versementsRecus;
      li.className = fait ? "fait" : i === 0 && j.etat === "a_payer" ? "premier" : "";
      const pastille = document.createElement("span"); pastille.className = "pastille"; pastille.textContent = fait ? "✓" : String(i + 1);
      const quand = document.createElement("span"); quand.className = "quand";
      const l1 = document.createElement("span"), l2 = document.createElement("small");
      if (j.nb === 1) { l1.textContent = "En une fois"; l2.textContent = "avant le démarrage de l'accompagnement"; }
      else if (i === 0) { l1.textContent = "Aujourd'hui"; l2.textContent = "avant le démarrage de l'accompagnement"; }
      else { l1.textContent = "Vers le " + date(e.date); l2.textContent = "prélevé automatiquement sur la même carte"; }
      if (fait) l2.textContent = "réglé";
      quand.append(l1, l2);
      const montant = document.createElement("span"); montant.className = "montant"; montant.textContent = e.montant + " €";
      li.append(pastille, quand, montant); liste.appendChild(li);
    });
    $("note").textContent = j.nb > 1
      ? "Vous ne payez que le premier versement aujourd'hui. Votre carte est enregistrée de façon sécurisée par Stripe et les versements suivants sont prélevés automatiquement, sans autre démarche de votre part. Les dates exactes partent du jour de votre premier paiement."
      : "Le reçu de paiement vous est envoyé par mail.";
    const bandeau = $("bandeau");
    bandeau.className = "bandeau cache";
    if (j.etat === "a_payer") {
      $("actions").classList.remove("cache");
      $("payer").textContent = "Payer " + j.echeances[0].montant + " € par carte";
    } else {
      $("actions").classList.add("cache");
      if (j.etat === "paye") { bandeau.className = "bandeau ok"; bandeau.textContent = "✓ Votre accompagnement est réglé. Merci !"; }
      if (j.etat === "en_cours") { bandeau.className = "bandeau ok"; bandeau.textContent = "✓ Votre paiement est enregistré. Les versements suivants seront prélevés automatiquement aux dates indiquées."; }
      if (j.etat === "incident") { bandeau.className = "bandeau alerte"; bandeau.textContent = "Le dernier prélèvement n'a pas abouti. Stripe va réessayer automatiquement ; vous pouvez aussi écrire à contact@lauraballo.com pour mettre à jour votre carte."; }
    }
    montrer("paiement");
  }

  $("payer").addEventListener("click", async () => {
    const b = $("payer"), err = $("erreur");
    err.style.display = "none"; b.disabled = true; b.textContent = "Ouverture du paiement…";
    try {
      const r = await fetch("/api/paiement", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ t: jeton }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.url) throw new Error(j.error || "Le paiement n'a pas pu être ouvert.");
      location.href = j.url;
    } catch (e) {
      err.textContent = e.message; err.style.display = "block"; b.disabled = false; b.textContent = "Payer par carte";
    }
  });

  (async () => {
    if (!jeton) return message("Lien incomplet", "Ce lien ne contient pas votre accompagnement. Utilisez le lien reçu par mail, ou écrivez à contact@lauraballo.com.");
    try {
      const r = await fetch("/api/paiement?t=" + encodeURIComponent(jeton) + (sessionId ? "&session_id=" + encodeURIComponent(sessionId) : ""));
      const j = await r.json().catch(() => ({}));
      if (r.status === 404) return message("Lien invalide", "Ce lien ne correspond à aucun accompagnement en cours. Écrivez à contact@lauraballo.com.");
      if (!r.ok) return message("Paiement pas encore disponible", j.error || "Réessayez dans un instant.");
      if (j.etat === "tiers") return message("Pas de paiement en ligne", "Votre accompagnement est réglé par votre entreprise ou votre financeur, sur devis. Vous n'avez rien à payer ici.");
      if (sessionId) history.replaceState(null, "", "/paiement?t=" + encodeURIComponent(jeton));
      afficher(j);
    } catch {
      message("Connexion impossible", "Vérifiez votre connexion puis rechargez la page.");
    }
  })();
</script>
</body>
</html>
