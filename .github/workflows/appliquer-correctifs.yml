name: 🩹 Appliquer un correctif

# Outil ponctuel : applique les fichiers .patch déposés dans _scripts/correctifs/
# (format « git format-patch », chacun garde son propre message de commit),
# puis les supprime. Sans correctif présent, il ne fait rien.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '_scripts/correctifs/**'

permissions:
  contents: write

concurrency:
  group: notion-publish
  cancel-in-progress: false

jobs:
  appliquer:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🩹 Appliquer et committer
        run: |
          shopt -s nullglob
          patches=(_scripts/correctifs/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then echo "Aucun correctif."; exit 0; fi
          git config user.name "Correctif Bot"
          git config user.email "bot@lauraballo.com"
          mkdir -p /tmp/correctifs
          cp "${patches[@]}" /tmp/correctifs/
          git rm -q "${patches[@]}"
          git commit -q -m "🧹 Retrait des correctifs appliqués"
          for p in /tmp/correctifs/*.patch; do
            echo "→ $p"
            git am --3way "$p"
          done
          git push origin HEAD:main

      - name: 🗺️ Régénérer le sitemap
        run: python _scripts/generate_sitemap.py
